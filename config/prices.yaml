# Anthropic API prices, USD per million tokens (MTok), first-party Claude API, standard tier.
# Source: https://platform.claude.com/docs/en/about-claude/pricing
# Checked: 2026-10-14. Re-check the source before relying on these numbers.
#
# Fields per model:
#   input           base (uncached) input tokens
#   output          output tokens (includes thinking tokens)
#   cache_write_5m  writes to the 5-minute prompt cache
#   cache_write_1h  writes to the 1-hour prompt cache
#   cache_read      cache hits and refreshes
#
# A model priced by prompt length uses `tiers` instead: each tier applies while the
# prompt (input + cache reads + cache writes) is at most `max_prompt_tokens`; the last
# tier has no limit.

checked_on: "2026-10-14"
source: https://platform.claude.com/docs/en/about-claude/pricing

# Applied to every price category when the request sets `inference_geo` to this value.
inference_geo_multipliers:
  us: 1.1

