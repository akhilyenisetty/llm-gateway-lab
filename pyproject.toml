[project]
name = "llm-gateway-lab"
version = "0.1.0"
description = "An LLM gateway for the Anthropic API that records exact usage and cost per call."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "anthropic>=1.14",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
