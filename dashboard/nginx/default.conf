server {
    listen 80;
    root /usr/share/nginx/html;

    # /admin and /gateway go to the gateway, when GATEWAY_UPSTREAM is set (Docker Compose).
    # Behind an AWS load balancer it's empty: the load balancer routes those paths to the
    # gateway itself, and nginx only serves the dashboard's files. See 40-gateway-proxy.sh.
    include /etc/nginx/snippets/*.conf;

    # Anything else is a dashboard page: serve the file if it exists, else the app shell,
    # so links like /sessions/abc work on reload.
    location / {
        try_files $uri /index.html;
    }
}
